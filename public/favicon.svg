<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Fondo del círculo: degradado radial azul cósmico profundo -->
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e2235"/>
      <stop offset="100%" stop-color="#0f111a"/>
    </radialGradient>

    <!-- Degradado del anillo: cian → verde portal -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b5cc"/>
      <stop offset="100%" stop-color="#97ce4c"/>
    </linearGradient>

    <!-- Glow verde para las letras JE -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo circular oscuro -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>

  <!-- Anillo perimetral cian → verde portal -->
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="url(#ring)" stroke-width="2.5"/>

  <!-- Destello de acento en la esquina superior izquierda -->
  <circle cx="14" cy="13" r="3.5" fill="#00b5cc" opacity="0.25"/>

  <!-- Letras JE — grosor máximo, centradas, con glow temático -->
  <text
    x="32"
    y="41"
    text-anchor="middle"
    dominant-baseline="auto"
    font-family="'Orbitron', 'Courier New', 'Lucida Console', monospace"
    font-size="24"
    font-weight="900"
    letter-spacing="1"
    fill="#97ce4c"
    filter="url(#glow)"
  >JE</text>

  <!-- Línea decorativa inferior — guiño a la barra del portal -->
  <line x1="18" y1="47" x2="46" y2="47" stroke="#00b5cc" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
